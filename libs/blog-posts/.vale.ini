StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = proselint, write-good, alex

Vocab = Blog

# Vale has no native MDX parser. Treating .mdx as Markdown gets the prose parsed;
# the ignores below strip the JSX that Markdown doesn't know about.
[formats]
mdx = md

# ---------------------------------------------------------------------------
# MDX syntax stripping.
#
# These MUST live in a format-scoped section. Vale silently ignores
# BlockIgnores/TokenIgnores when they appear in a path-glob section such as
# [src/lib/posts/**/*.mdx] — the config parses fine and the JSX gets linted as
# prose anyway. Keep them here.
# ---------------------------------------------------------------------------
[*.mdx]
# Vale's documented suppression syntax is the HTML comment `<!-- vale ... -->`,
# which MDX refuses to parse ("Unexpected character `!`") and would break the
# site build. Pointing Vale at MDX's own comment form makes per-instance
# suppression work in a way that still compiles:
#
#   {/* vale write-good.Passive = NO */}
#   ...prose Vale should leave alone...
#   {/* vale write-good.Passive = YES */}
CommentDelimiters = {/*, */}

# Top-level `export const name = ( <>...</> );` JSX fragment blocks.
BlockIgnores = (?s)export const \w+ = \(.*?\n\);

# Inline JSX: <Cite> wraps a fragment reference rather than prose, so the whole
# element goes. Everything else drops only the tag, leaving inner prose linted.
TokenIgnores = (<Cite[^>]*>.*?</Cite>), (</?[A-Z][A-Za-z]*[^>]*/?>), (\{[a-zA-Z_$][\w$.]*\})

# ---------------------------------------------------------------------------
# Baseline voice: applies to every post.
# Technical posts get exactly this. Tiki posts relax it in the section below.
# ---------------------------------------------------------------------------
[src/lib/posts/**/*.mdx]
BasedOnStyles = Vale, CraigoryBlog, alex, proselint, write-good

# Casing of tool names is handled by CraigoryBlog.BrandNames, which targets
# specific wrong spellings. Vale.Terms instead enforces the casing of every
# vocabulary entry, which fights legitimate lowercase CLI usage (`nx build`,
# `yarn add`) in prose.
Vale.Terms = NO

# E-Prime bans every form of "to be" — unusable for ordinary prose.
write-good.E-Prime = NO
# Starting a sentence with "But" is a deliberate voice choice here.
proselint.But = NO
# Wants "décor", "café". Unaccented forms are standard in American English.
proselint.Diacritical = NO
# Wants "…" for "..." and similar. remark-smartypants already does this at
# render time, so the source form is correct as written.
proselint.Typography = NO
# These flag ordinary words ("crack", "balls", "hole") as possible profanity.
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
# Off after triaging all 93 hits, not on assumption. Seven were worth changing
# (three instructions better as imperatives, four places where a first-person
# post slipped into passive and hid the team's own agency — "The decision was
# made" became "We decided"); those edits are in. The other 86 were correct:
# the actor is the system, the tool, or the reader. The rule matches
# "be/is/are/was + participle" with no notion of whether an actor exists, so it
# cannot tell those apart, and 86 inline suppressions would be worse than this
# line. Re-enable and re-read if the blog shifts toward narrative technical
# writing, where the agency-hiding failure it did catch is more common.
write-good.Passive = NO
# Superseded by CraigoryBlog.Wordiness. TooWordy flagged precise single words
# as verbose ("multiple", "minimum", "equivalent", "however", "modify") and
# wanted shorter words that mean something different, plus 20 hits on "it is"/
# "it was" that were real pronouns rather than expletive constructions. The
# genuinely wordy phrases it did catch are kept in the custom rule.
write-good.TooWordy = NO
# "hang out" is the only realistic trigger on a blog about going to bars.
alex.Suicide = NO
# Hits were "master" (in a post explicitly about the main/master branch naming
# transition) and "totem" (describing Polynesian-style bar decor). Both correct.
alex.Race = NO
# "disabled" here describes a setting, not a person ("scripts are globally
# disabled"). Recurs in any post about configuration.
alex.Ablist = NO

# Subjective style rules stay visible locally but don't block CI, which runs
# with --minAlertLevel=error. Advisory, not gospel.
write-good.Weasel = suggestion
write-good.ThereIs = suggestion
alex.Condescending = suggestion
proselint.Cliches = suggestion
proselint.Skunked = suggestion
proselint.Very = suggestion

# ---------------------------------------------------------------------------
# Tiki posts: first-person narrative reviews. Praise, hedging, and subjective
# description are the point of the format, so the rules that police them are
# switched off here. This section is last so it wins over the baseline.
# ---------------------------------------------------------------------------
[src/lib/posts/tiki/**/*.mdx]
write-good.Weasel = NO
write-good.So = NO
write-good.ThereIs = NO
proselint.Hedging = NO
proselint.Very = NO
proselint.Hyperbole = NO
proselint.Cliches = NO
proselint.Skunked = NO
# "easy"/"clearly" are plain description here ("easy to get to", "speak-easy"),
# not the "this is simple, reader" condescension the rule exists to catch. That
# failure mode belongs to instructional writing, so the rule stays on for
# technical posts.
alex.Condescending = NO
# Reduplication is inherent to tiki naming: "Tiki Tiki Bang Bang", "Chi Chi".
# Vale.Repetition and write-good.Illusions both flag it.
Vale.Repetition = NO
write-good.Illusions = NO
# Conversational asides ("at the end of the day") suit a first-person review.
proselint.CorporateSpeak = NO
CraigoryBlog.MarketingLanguage = NO
CraigoryBlog.SelfReferential = NO
