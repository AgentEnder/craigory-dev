name: PR Checks + Deployment

on:
  pull_request:

jobs:
  deploy:
    name: 'PR Checks and Preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Provides vale for the blog-posts prose lint target (see mise.toml)
      - name: Setup dev tools with mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.15.0'
          cache: 'pnpm'

      # Open graph image generation runs via bun (nx prepare target)
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.7'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=verbose
        timeout-minutes: 10

      # ~130MB of ONNX weights for bge-small-en-v1.5. They never change, so they
      # get a stable key and stay out of the content-keyed cache below.
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/related-content/models
          key: embedding-model-bge-small-en-v1.5-${{ runner.os }}

      # The embeddings DB is hash-gated per item, so even a stale one lets every
      # unchanged post skip re-embedding — restore-keys makes that the normal
      # case rather than a lucky one.
      - name: Cache embeddings
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.cache/related-content
            !node_modules/.cache/related-content/models
          key: related-content-${{ runner.os }}-${{ hashFiles('libs/blog-posts/src/lib/posts/**/*', 'libs/presentations/src/presentation-data/**/*') }}
          restore-keys: |
            related-content-${{ runner.os }}-

      # We use playwright to generate open graph images and for testing
      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Setup Git User
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Build / Test / Lint
        run: |
          npx nx run-many -t build,test,lint --exclude=tiki-menu
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # See deploy.yml: authenticated public-only reads for orgs that reject
          # the fine-grained PAT, off the shared-IP 60/hr budget.
          GITHUB_PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Add your deployment steps here
      - name: Deploy to preview environment
        run: |
          PUBLIC_ENV__BASE_URL=$PATH_PREFIX npx nx build craigory-dev
          mkdir -p ./dist/gh-pages-root/pr/$GITHUB_SHA
          cp -r ./dist/apps/craigory-dev/client "./dist/gh-pages-root${PATH_PREFIX}"
          cp ./dist/apps/craigory-dev/client/CNAME ./dist/gh-pages-root

          npx nx deploy craigory-dev -c preview --directory ./dist/gh-pages-root
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GITHUB_PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PATH_PREFIX: /pr/${{ github.event.number || github.sha }}
          SKIP_FIREBASE_DEPLOY: 'true'
          # craigory-dev's deploy fans out over `apps/*` via `^deploy`, so this
          # step also ships justlisten. `-c preview` routes it to
          # `wrangler versions upload` (0% traffic, its own URL) instead of
          # `wrangler deploy`, leaving production serving the live version.
          # Without the token the app's deploy script skips with a note rather
          # than failing the PR — see apps/justlisten/tools/deploy.mjs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler appends one NDJSON record per action here; the comment
          # step below reads the version's preview URL back out of it rather
          # than scraping stdout or hardcoding the workers.dev subdomain.
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/tmp/wrangler-output.json
        # only if agentender/craigory-dev
        if: github.repository == 'agentender/craigory-dev'

      - name: Comment on PR
        run: |
          pnpm dlx tsx tools/update-preview-comment.ts
        env:
          PATH_PREFIX: /pr/${{ github.event.number || github.sha }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/tmp/wrangler-output.json
        # only if agentender/craigory-dev
        if: github.repository == 'agentender/craigory-dev'
