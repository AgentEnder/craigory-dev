packages:
  # Apps directory - contains all applications
  - 'apps/*'

  # Libs directory - contains all libraries/packages
  - 'libs/*'

  # Packages directory - contains publishable npm packages
  - 'packages/*'

  # Tools directory if it contains packages
  - 'tools'
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  cypress: true
  esbuild: true
  nx: true
  # @huggingface/transformers (related-content embedding step) needs the native
  # ONNX runtime binary its install script fetches; sharp is transformers' image
  # decoder, unused here but imported eagerly enough to matter.
  onnxruntime-node: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true
  # workerd: wrangler's local Workers runtime (justlisten dev server).
  workerd: true
catalog:
  cli-forge: ^1.9.2
  es-main: ^1.4.0
  vike: 0.4.258
  vike-react: ^0.6.5
minimumReleaseAgeExclude:
  - nx
  - '@nx/*'
  - miniflare@5.20260815.0-alpha
  - wrangler@4.124.0
